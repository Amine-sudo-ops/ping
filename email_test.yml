#####################################################################
# SEND GLOBAL EMAIL REPORT
#####################################################################

- name: Send global Apache audit report by email
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    smtp_sender: "mohamedamine.messaoudi001@gmail.com"
    smtp_recipient: "mohamed-amine.messaoudi@sagemcom.com"

    smtp_username: "{{ lookup('env', 'SMTP_USERNAME') }}"
    smtp_password: "{{ lookup('env', 'SMTP_PASSWORD') }}"

  tasks:

    #################################################################
    # CHECK SMTP CREDENTIALS
    #################################################################

    - name: Verify SMTP credentials are available
      ansible.builtin.assert:
        that:
          - smtp_username | length > 0
          - smtp_password | length > 0
        fail_msg: "SMTP credentials are missing. Check AWX Custom Credential."


    #################################################################
    # PREPARE GLOBAL EMAIL BODY
    #################################################################

    - name: Prepare global Apache audit email
      ansible.builtin.set_fact:
        email_body: |
          ==================================================
                    APACHE VERSION AUDIT REPORT
          ==================================================

          AWX JOB ID       : {{ lookup('env', 'AWX_JOB_ID') | default('N/A', true) }}
          INVENTORY        : {{ lookup('env', 'AWX_INVENTORY_NAME') | default('N/A', true) }}
          PLAYBOOK         : apache_version.yml
          REPORT DATE      : {{ lookup('pipe', 'date "+%Y-%m-%d %H:%M:%S"') }}

          NUMBER OF SERVERS: {{ hostvars['localhost']['apache_audit_hosts'] | length }}

          ==================================================
                         SERVERS DETAILS
          ==================================================

          {% for server in hostvars['localhost']['apache_audit_hosts'] %}
          {{ hostvars[server].apache_report | default('No report available for ' ~ server) }}

          {% endfor %}

          ==================================================
                         END OF REPORT
          ==================================================

          This email was automatically generated by Ansible AWX.


    #################################################################
    # SEND EMAIL USING PYTHON SMTP
    #################################################################

    - name: Send Apache audit report through Gmail SMTP
      ansible.builtin.shell: |
        python3 - <<'PY'
        import os
        import smtplib
        from email.message import EmailMessage

        msg = EmailMessage()

        msg["Subject"] = "AWX - Apache Version Audit"
        msg["From"] = os.environ["SMTP_SENDER"]
        msg["To"] = os.environ["SMTP_RECIPIENT"]

        msg.set_content(os.environ["EMAIL_BODY"])

        with smtplib.SMTP(
            os.environ["SMTP_SERVER"],
            int(os.environ["SMTP_PORT"]),
            timeout=30
        ) as server:

            server.ehlo()
            server.starttls()
            server.ehlo()

            server.login(
                os.environ["SMTP_USERNAME"],
                os.environ["SMTP_PASSWORD"]
            )

            server.send_message(msg)

        print("Email sent successfully.")
        PY
      args:
        executable: /bin/bash
      environment:
        SMTP_SERVER: "{{ smtp_server }}"
        SMTP_PORT: "{{ smtp_port | string }}"
        SMTP_SENDER: "{{ smtp_sender }}"
        SMTP_RECIPIENT: "{{ smtp_recipient }}"
        SMTP_USERNAME: "{{ smtp_username }}"
        SMTP_PASSWORD: "{{ smtp_password }}"
        EMAIL_BODY: "{{ email_body }}"
      register: email_result
      changed_when: true
      no_log: true

    - name: Display email notification result
      ansible.builtin.debug:
        msg: "Apache audit report email sent successfully."
