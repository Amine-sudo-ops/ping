---
- name: Apache Version Audit - Ubuntu / CentOS / Rocky
  hosts: all
  become: yes
  gather_facts: yes

  tasks:

    #################################################################
    # APACHE DETECTION - UBUNTU
    #################################################################

    - name: Get Apache version on Ubuntu
      command: apache2 -v
      register: apache_version_debian
      changed_when: false
      failed_when: false
      when: ansible_os_family == "Debian"

    - name: Check Apache service on Ubuntu
      command: systemctl is-active apache2
      register: apache_service_debian
      changed_when: false
      failed_when: false
      when: ansible_os_family == "Debian"

    - name: Check Apache package on Ubuntu
      command: dpkg-query -W apache2
      register: apache_package_debian
      changed_when: false
      failed_when: false
      when: ansible_os_family == "Debian"


    #################################################################
    # APACHE DETECTION - CENTOS / ROCKY
    #################################################################

    - name: Get Apache version on CentOS / Rocky
      command: httpd -v
      register: apache_version_rhel
      changed_when: false
      failed_when: false
      when: ansible_os_family == "RedHat"

    - name: Check Apache service on CentOS / Rocky
      command: systemctl is-active httpd
      register: apache_service_rhel
      changed_when: false
      failed_when: false
      when: ansible_os_family == "RedHat"

    - name: Check Apache package on CentOS / Rocky
      command: rpm -q httpd
      register: apache_package_rhel
      changed_when: false
      failed_when: false
      when: ansible_os_family == "RedHat"


    #################################################################
    # NORMALIZE APACHE INFORMATION
    #################################################################

    - name: Set Apache information for Ubuntu
      set_fact:
        apache_installed: "{{ apache_package_debian.rc == 0 }}"
        apache_version: "{{ apache_version_debian.stdout | default('Not installed', true) if apache_package_debian.rc == 0 else 'Not installed' }}"
        apache_service: "{{ apache_service_debian.stdout | default('not found', true) }}"
      when: ansible_os_family == "Debian"

    - name: Set Apache information for CentOS / Rocky
      set_fact:
        apache_installed: "{{ apache_package_rhel.rc == 0 }}"
        apache_version: "{{ apache_version_rhel.stdout | default('Not installed', true) if apache_package_rhel.rc == 0 else 'Not installed' }}"
        apache_service: "{{ apache_service_rhel.stdout | default('not found', true) }}"
      when: ansible_os_family == "RedHat"


    #################################################################
    # FINAL REPORT
    #################################################################

    - name: Display Apache audit report
      debug:
        msg:
          - "============================================"
          - "HOSTNAME        : {{ ansible_hostname }}"
          - "IP ADDRESS      : {{ ansible_default_ipv4.address | default('Unknown') }}"
          - "OPERATING SYSTEM: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "APACHE STATUS   : {{ 'INSTALLED' if apache_installed else 'NOT INSTALLED' }}"
          - "APACHE VERSION  : {{ apache_version }}"
          - "APACHE SERVICE  : {{ apache_service }}"
          - "============================================"

    #################################################################
    # COMPLETION
    #################################################################

    - name: Apache audit completion
      debug:
        msg: "Apache audit completed successfully on {{ inventory_hostname }}"
