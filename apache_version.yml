---
- name: OS Version Audit - Ubuntu / CentOS / Rocky
  hosts: all
  become: yes
  gather_facts: yes

  tasks:

    #################################################################
    # OS DETECTION - UBUNTU
    #################################################################

    - name: Set OS information for Ubuntu
      set_fact:
        os_name: "{{ ansible_distribution }}"
        os_version: "{{ ansible_distribution_version }}"
        os_family: "{{ ansible_os_family }}"
      when: ansible_os_family == "Debian"

    #################################################################
    # OS DETECTION - CENTOS / ROCKY
    #################################################################

    - name: Set OS information for CentOS / Rocky
      set_fact:
        os_name: "{{ ansible_distribution }}"
        os_version: "{{ ansible_distribution_version }}"
        os_family: "{{ ansible_os_family }}"
      when: ansible_os_family == "RedHat"

    #################################################################
    # INVENTORY SUMMARY
    #################################################################

    - name: Display total number of VMs
      debug:
        msg:
          - "============================================"
          - "TOTAL NUMBER OF VMs : {{ groups['all'] | length }}"
          - "============================================"
      run_once: true

    #################################################################
    # FINAL REPORT
    #################################################################

    - name: Display OS audit report
      debug:
        msg:
          - "============================================"
          - "HOSTNAME        : {{ ansible_hostname }}"
          - "IP ADDRESS      : {{ ansible_default_ipv4.address | default('Unknown') }}"
          - "OS FAMILY       : {{ os_family }}"
          - "OPERATING SYSTEM: {{ os_name }}"
          - "OS VERSION      : {{ os_version }}"
          - "KERNEL VERSION  : {{ ansible_kernel }}"
          - "============================================"

    #################################################################
    # COMPLETION
    #################################################################

    - name: OS audit completion
      debug:
        msg: "OS audit completed successfully on {{ inventory_hostname }}"
